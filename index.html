<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Profile Card Ui Design</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="profile-card">
       
        <div class="image-container">
            <img src="profile.jpg" alt="Profile" class="profile-img" onerror="this.src='https://placehold.co/200x200/1a1f2e/ffffff?text=Profile'"/>
            <div class="verified-badge">
                <i class="bx bx-check"></i>
            </div>
        </div>
        <div class="text-data">
            <span class="name">Govil Yadav</span>
            <span class="job">Youtuber & Blogger</span>
        </div>
        <div class="media-buttons">
            <a href="#" class="link fb" aria-label="Facebook">
                <i class="bx bxl-facebook"></i>
            </a>
            <a href="#" class="link tw" aria-label="Twitter">
                <i class="bx bxl-twitter"></i>
            </a>
            <a href="#" class="link ig" aria-label="Instagram">
                <i class="bx bxl-instagram"></i>
            </a>
            <a href="#" class="link yt" aria-label="YouTube">
                <i class="bx bxl-youtube"></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button primary">
                <i class="bx bx-user-plus"></i> Subscribe
            </button>
            <button class="button secondary">
                <i class="bx bx-message-square-dots"></i> Message
            </button>
        </div>
        <div class="analytics">
            <div class="data">
                <span class="number">36.5M</span>
                <span class="label"><i class="bx bxs-heart"></i> Likes</span>
            </div>
            <div class="data">
                <span class="number">15.2M</span>
                <span class="label"><i class="bx bxs-chat"></i> Comments</span>
            </div>
            <div class="data">
                <span class="number">12.8M</span>
                <span class="label"><i class="bx bxs-share"></i> Shares</span>
            </div>
        </div>
    </div>  

</body>
</html>
